# -- Visual -------------------------------------------------------------------

# run '~/.config/tmux/plugins/catppuccin-tmux/catppuccin.tmux'

set -g @catppuccin_flavor 'mocha'

## Start window indexing from 1
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on
set-option -g allow-rename off
set-option -g automatic-rename off
set-option -g default-shell /bin/zsh

set-option -sg escape-time 10

set-option -g default-terminal 'tmux-256color'
set-option -g terminal-overrides ',tmux-256color:RGB'

# Reduce scrollback duplication from TUI apps (e.g. Claude Code) that redraw in place
set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Status Bar
set -g @catppuccin_pane_default_text "#W"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W#{?window_zoomed_flag, 󰊓,}"
set -g @catppuccin_window_default_text " #W"
set -g status-right-length 100
set -g status-left-length 101
set -g status-interval 5
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#(timer tmux)"

# -- Monitoring ---------------------------------------------------------------

# Monitor activity in windows
setw -g monitor-activity on
set -g visual-activity off  # Don't show tmux's own message
set -g activity-action other  # Only notify for other windows

# Send bell on activity
set -g bell-action any
set -g visual-bell off

# -- Navigation ---------------------------------------------------------------

set -g mouse on                   # enable mouse support
set-window-option -g mode-keys vi # use vi keys
set -s escape-time 10             # faster command sequences
set -sg repeat-time 600           # increase repeat timeout
set -s focus-events on

# -- Key Bindings -------------------------------------------------------------

## Remap prefix to C-a
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix
bind l send-keys 'C-l'

## simple session picker
# bind-key g choose-session

## sesh: fuzzy switcher / creator for sessions (incl. zoxide dirs)
bind-key g display-popup -E -w 60% -h 60% "sesh connect \"$(sesh list -tc | fzf --no-sort --ansi --border-label ' sesh ' --prompt '⚡ ')\""
## kill sessions via fzf (Tab to multi-select, Enter to kill)
bind-key k display-popup -E -w 60% -h 60% "sesh list -t | fzf --multi --no-sort --border-label ' kill sessions ' --header 'Tab to mark, Enter to kill' --prompt '💀 ' | xargs -I{} tmux kill-session -t {}"

## maximise a pane
bind z resize-pane -Z

## Use vi keys for selection
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle

## Open panes in current dir
bind "-" split-window -v -c "#{pane_current_path}"
bind "|" split-window -h -c "#{pane_current_path}"

## Toggle a 2-pane window between side-by-side and stacked
bind / if-shell -F '#{==:#{pane_width},#{window_width}}' 'select-layout even-horizontal' 'select-layout even-vertical'

## Resize panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

## Rename current window via a pre-filled gum popup
bind r display-popup -E -w 60 -h 5 'cur=$(tmux display -p "#{window_name}"); new=$(gum input --value "$cur" --prompt "Rename window: "); [ -n "$new" ] && tmux rename-window -- "$new"'

## Redraw client (refresh-client, relocated from prefix+r)
bind M-r refresh-client

## Floating Terminal
set -g @floax-width '80%'
set -g @floax-height '80%'
set -g @floax-border-color 'magenta'
set -g @floax-text-color 'blue'
set -g @floax-change-path 'true'
set -g @floax-bind '-n M-t'

## -- tmux thumbs
set -g @thumbs-key f

# -- Plugins ------------------------------------------------------------------

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'catppuccin/tmux#v2.1.3'
set -g @plugin 'omerxx/tmux-floax'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# -- Session persistence (resurrect + continuum) -----------------------------
set -g @resurrect-capture-pane-contents 'on' # save/restore visible pane contents
set -g @continuum-restore 'on'               # auto-restore sessions on tmux server start
set -g @continuum-save-interval '15'         # auto-save every 15 minutes

run '~/.tmux/plugins/tpm/tpm'

# -- Post-TPM (catppuccin @thm_* variables are now available) -----------------

# Pane borders (theme-aware)
set -gF pane-border-style "fg=#{@thm_overlay_0}"
set -gF pane-active-border-style "fg=#{@thm_pink}"

# Kubernetes context (theme-aware)
# Two appends: -agF resolves @thm_* colours once; plain -ag keeps #() live.
set -agF status-right "#[fg=#{@thm_blue},bg=#{@thm_surface_0}]#[fg=#{@thm_crust},bg=#{@thm_blue}] 󱃾 #[fg=#{@thm_fg},bg=#{@thm_surface_0}] "
set -ag  status-right "#(kubectl config current-context 2>/dev/null | sed 's|.*/||' | cut -c1-30) "
