# Starship configuration
# 2-line prompt: path + git status on line 1 (pink), prompt on line 2

format = """
$directory$git_branch$git_status\
$line_break\
$character"""

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

[directory]
truncation_length = 3
truncate_to_repo = true
style = "bold red"

[git_branch]
style = "bold red"
format = " [$symbol$branch]($style)"

[git_status]
style = "bold red"
format = "([$all_status$ahead_behind]($style))"
