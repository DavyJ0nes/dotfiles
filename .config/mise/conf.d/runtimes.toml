# Language runtimes managed by mise (was previously Homebrew).
#
# Pin major.minor for predictability; bump deliberately. For tools that move
# fast and where breakage is cheap (zig, bun), use "latest".

[tools]
go     = "1.26"
# Pin the OTP flavor to match `erlang` below — a bare "1.20" resolves to the
# highest available OTP build (otp-29) which won't boot on OTP 27. The
# "1.20-otp-27" form still tracks 1.20.x patch releases.
elixir = "1.20-otp-27"
erlang = "27"
python = "3.13"
zig    = "latest"
dotnet = "10"
bun    = "latest"
